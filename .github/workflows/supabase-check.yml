name: supabase-check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase db start

      - run: supabase db lint --level error

      # supabase/tests/database の pgTAP テスト
      - run: supabase test db
